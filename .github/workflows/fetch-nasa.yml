name: Fetch NASA Data

permissions:
  contents: read

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

# Only APOD and EPIC are fetched. The Mars Rover Photos API behind
# api.nasa.gov/mars-photos was a Heroku app that no longer exists (it returns
# an HTML "No such app" page), and the InSight weather feed has returned the
# same 2020 sols since the lander died in December 2022. The marsPhoto and
# marsWeather singletons are left as they are in MongoDB.

jobs:
  update-nasa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Fetch APOD
        env:
          NASA_KEY: ${{ secrets.NASA_KEY }}
        run: |
          curl --silent "https://api.nasa.gov/planetary/apod?api_key=$NASA_KEY&thumbs=true" > space.json
          jq -e '.date' space.json > /dev/null

      # The image itself is served from the public EPIC archive, which needs no
      # key. Building the URL on api.nasa.gov would bake NASA_KEY into the
      # document and expose it to every visitor.
      - name: Fetch EPIC Earth image
        env:
          NASA_KEY: ${{ secrets.NASA_KEY }}
        run: |
          curl -s "https://api.nasa.gov/EPIC/api/natural?api_key=$NASA_KEY" \
            | jq '.[0] | {date: .date, image: .image, caption: .caption, url: ("https://epic.gsfc.nasa.gov/archive/natural/" + (.date | split(" ")[0] | gsub("-";"/")) + "/png/" + .image + ".png") }' > epic.json
          jq -e '.image' epic.json > /dev/null

      - name: Push to MongoDB (NASA)
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ secrets.MONGODB_DB }}
        run: |
          node --loader ts-node/esm --experimental-specifier-resolution=node scripts/push-to-mongo.ts \
            --file space.json --singleton space
          node --loader ts-node/esm --experimental-specifier-resolution=node scripts/push-to-mongo.ts \
            --file epic.json --singleton epic

      # Stamps singletons/meta.fetchedAt.space; the dashboard shows feed age from it.
      - name: Record fetch time
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ secrets.MONGODB_DB }}
        run: |
          node --loader ts-node/esm --experimental-specifier-resolution=node scripts/push-to-mongo.ts \
            --meta space
